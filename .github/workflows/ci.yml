name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyserial
      - name: Estructura, firmware en banco host y logica de las HMI
        run: python -m unittest discover -s tests -v

  firmware:
    # compile-sketches necesita Python 3.12.4, que no existe para Ubuntu 26.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compilar los dos firmwares con el nucleo real
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:esp32:nano_nora
          platforms: |
            - name: arduino:esp32
          libraries: |
            - name: Adafruit PWM Servo Driver Library
          sketch-paths: |
            - 01_Oficial/Transmisor_NanoESP32
            - 01_Oficial/Ejecutor_NanoESP32
